<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yeeeeeeeeeeeeeeeeeeeeeeeeee 💕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .container {
            text-align: center;
            background: white;
            padding: 50px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 700px;
            width: 90%;
            animation: slideIn 0.8s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #e91e63;
            font-size: 3em;
            margin-bottom: 20px;
            animation: bounce 1s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .message {
            font-size: 1.5em;
            color: #555;
            margin: 30px 0;
            line-height: 1.6;
        }

        .image-container {
            margin: 40px auto;
            width: 80%;
            max-width: 80%;
            border-radius: 15px;
            overflow: hidden;
            background: linear-gradient(135deg, #fce4ec, #f8bbd0);
            border: 3px solid #e91e63;
        }

        .image-container img {
            width: 100%;
            height: auto;
            display: block;
            vertical-align: middle;
        }

        .emoji-rain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: -1;
        }

        .emoji {
            position: absolute;
            font-size: 2em;
            animation: fall linear infinite;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
            }
        }

        .back-btn {
            margin-top: 30px;
            padding: 15px 40px;
            font-size: 1.1em;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .back-btn:hover {
            transform: scale(1.05);
        }

        .hearts-decoration {
            font-size: 3em;
            margin: 20px 0;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2em;
            }
            
            .message {
                font-size: 1.2em;
            }
        }
    </style>
</head>
<body>
    <div class="emoji-rain" id="emojiRain"></div>

    <div class="container">
        <h1>🎉 It's a Date! 🎉</h1>
        
        <div class="hearts-decoration">💖💕💗💝💘</div>
        
        <p class="message">
            anh rất vui vì được là valentine của em. a mong mình có thật nhiều valentine cùng nhau nhé 💕💕💕
        </p>

        <div class="image-container">
            <img src="date.png" alt="Us Together">
        </div>

        <p class="message" style="font-size: 1.3em; color: #e91e63;">
            ❤️ i loveee youuuuuuuu ❤️
        </p>

        <button class="back-btn" onclick="window.location.href='index.html'">
            ← Back
        </button>
    </div>

    <script>
        // Create falling emojis
        const emojiRain = document.getElementById('emojiRain');
        const emojis = ['💕', '💖', '💗', '💝', '💘', '🌹', '❤️', '💑'];
        
        function createEmoji() {
            const emoji = document.createElement('div');
            emoji.className = 'emoji';
            emoji.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            emoji.style.left = Math.random() * 100 + 'vw';
            emoji.style.animationDuration = (Math.random() * 3 + 2) + 's';
            emoji.style.opacity = Math.random() * 0.5 + 0.3;
            emojiRain.appendChild(emoji);
            
            setTimeout(() => {
                emoji.remove();
            }, 5000);
        }
        
        setInterval(createEmoji, 300);
        
        // Create initial emojis
        for (let i = 0; i < 10; i++) {
            setTimeout(createEmoji, i * 200);
        }
    </script>
</body>
</html>
