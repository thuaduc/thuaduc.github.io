<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine? 💕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .password-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .password-container h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 2em;
        }

        .password-container input {
            width: 100%;
            padding: 15px;
            font-size: 1.1em;
            border: 2px solid #667eea;
            border-radius: 10px;
            margin-bottom: 20px;
            outline: none;
        }

        .password-container button {
            width: 100%;
            padding: 15px;
            font-size: 1.1em;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .password-container button:hover {
            transform: scale(1.05);
        }

        .error-message {
            color: #e91e63;
            margin-top: 10px;
            display: none;
        }

        .container {
            display: none;
            text-align: center;
            background: white;
            padding: 50px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 90%;
            position: relative;
        }

        .hearts {
            position: absolute;
            font-size: 100px;
            animation: float 3s ease-in-out infinite;
            opacity: 0.1;
        }

        .heart-left {
            top: 20px;
            left: 20px;
        }

        .heart-right {
            bottom: 20px;
            right: 20px;
            animation-delay: 1.5s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        h1 {
            color: #e91e63;
            font-size: 2.5em;
            margin-bottom: 30px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .image-container {
            margin: 30px 0;
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 15px;
            overflow: hidden;
            background: linear-gradient(135deg, #fce4ec, #f8bbd0);
            display: flex;
            justify-content: center;
            align-items: center;
            border: 3px solid #e91e63;
        }

        .image-container img,
        .image-container video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .image-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 12px;
        }

        .placeholder-text {
            color: #e91e63;
            font-size: 1.2em;
            opacity: 0.5;
        }

        .button-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 40px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 20px 50px;
            font-size: 1.5em;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            font-weight: bold;
        }

        .yes-btn {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: white;
        }

        .yes-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 10px 25px rgba(17, 153, 142, 0.4);
        }

        .no-btn {
            background: linear-gradient(135deg, #eb3349, #f45c43);
            color: white;
            position: relative;
            transition: none;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.8em;
            }
            
            .btn {
                padding: 15px 35px;
                font-size: 1.2em;
            }

            .image-container {
                aspect-ratio: 16 / 9;
            }
        }
    </style>
</head>
<body>
    <!-- Password Screen -->
    <div class="password-container" id="passwordScreen">
        <h2>🔒 Mật khẩu máy tính của em</h2>
        <input type="password" id="passwordInput" placeholder="Enter password..." onkeypress="if(event.key==='Enter') checkPassword()">
        <button onclick="checkPassword()">Enter</button>
        <p class="error-message" id="errorMessage">❌ Wrong password! Try again.</p>
    </div>

    <!-- Main Content -->
    <div class="container" id="mainContent">
        <div class="hearts heart-left">💕</div>
        <div class="hearts heart-right">💖</div>
        
        <h1>Will You Be My Valentine? 💝</h1>
        
        <div class="image-container">
            <!-- Option 1: Your own video (put video.mp4 in same folder or use full URL) -->
            <video src="video.mp4" autoplay loop muted playsinline></video>

            <!-- Option 2: YouTube embed - use the embed URL, e.g. https://www.youtube.com/embed/VIDEO_ID -->
            <!-- <iframe src="https://www.youtube.com/embed/VIDEO_ID?autoplay=1" allow="autoplay" allowfullscreen></iframe> -->

            <!-- Option 3: Image -->
            <!-- <img src="your-image-url.jpg" alt="Us Together"> -->

            <!-- <p class="placeholder-text">Our Picture or Video Here 📸🎬</p> -->
        </div>

        <div class="button-container">
            <button class="btn yes-btn" onclick="window.location.href='date.html'">
                Có 💕
            </button>
            <button class="btn no-btn" id="noBtn">
                Đéo 😢
            </button>
        </div>
    </div>

    <script>
        const correctPassword = "yeuanhduc";

        function checkPassword() {
            const input = document.getElementById('passwordInput').value;
            const errorMessage = document.getElementById('errorMessage');
            
            if (input === correctPassword) {
                document.getElementById('passwordScreen').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
            } else {
                errorMessage.style.display = 'block';
                document.getElementById('passwordInput').value = '';
                
                // Shake animation
                const container = document.querySelector('.password-container');
                container.style.animation = 'shake 0.5s';
                setTimeout(() => {
                    container.style.animation = '';
                }, 500);
            }
        }

        // Add shake animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-10px); }
                75% { transform: translateX(10px); }
            }
        `;
        document.head.appendChild(style);

        // No button movement - runs away fast so user can never click it
        const noBtn = document.getElementById('noBtn');
        const container = document.querySelector('.container');
        let moveCount = 0;
        const PROXIMITY_RADIUS = 120; // Move when cursor is within this many px

        function moveNoButton() {
            moveCount++;
            const maxMove = Math.min(80 + moveCount * 15, 280); // Bigger jumps, higher cap
            
            const randomX = (Math.random() - 0.5) * maxMove * 2;
            const randomY = (Math.random() - 0.5) * maxMove * 2;
            
            const rect = noBtn.getBoundingClientRect();
            const containerRect = container.getBoundingClientRect();
            
            let newX = rect.left - containerRect.left + randomX;
            let newY = rect.top - containerRect.top + randomY;
            
            newX = Math.max(10, Math.min(newX, containerRect.width - rect.width - 10));
            newY = Math.max(10, Math.min(newY, containerRect.height - rect.height - 10));
            
            noBtn.style.position = 'absolute';
            noBtn.style.left = newX + 'px';
            noBtn.style.top = newY + 'px';
        }

        // Move when cursor gets close (before they can click)
        container.addEventListener('mousemove', function(e) {
            const rect = noBtn.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            const dist = Math.hypot(e.clientX - cx, e.clientY - cy);
            if (dist < PROXIMITY_RADIUS) moveNoButton();
        });

        noBtn.addEventListener('mouseenter', moveNoButton);
        noBtn.addEventListener('mousedown', function(e) { e.preventDefault(); moveNoButton(); });

        // Mobile touch - move on touchstart and if finger approaches
        noBtn.addEventListener('touchstart', function(e) {
            e.preventDefault();
            moveNoButton();
        });
        container.addEventListener('touchmove', function(e) {
            if (e.touches.length) {
                const rect = noBtn.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                const dist = Math.hypot(e.touches[0].clientX - cx, e.touches[0].clientY - cy);
                if (dist < PROXIMITY_RADIUS) moveNoButton();
            }
        }, { passive: true });
Mâtk    </script>
</body>
</html>
